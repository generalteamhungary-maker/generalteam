<!DOCTYPE html>
<html lang="hu">
<head>
<!--gt-head--><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0F2B36"><script src="fiok.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Alvállalkozói felület – GeneralTeam</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#F4F3EF;--paper:#fff;--ink:#0F2B36;--muted:#56656D;--line:#DCE2E4;--soft:#EBEEEC;--brass:#C49A5C;--brass-d:#8A6430;--brass-t:#F6EEDF;--ok:#1F7A4D;--ok-t:#E3F2EA;--warn:#9A5B00;--warn-t:#FDF1DF;--bad:#B3261E;--f:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5}
h1,h2,h3{margin:0;letter-spacing:-.01em;line-height:1.15}h1{font-size:clamp(24px,5vw,32px);font-weight:800}h2{font-size:20px;font-weight:700}h3{font-size:17px;font-weight:700}
p{margin:0}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
.logo{display:flex;gap:10px;align-items:center}.logo b{font-size:18px;font-weight:800;display:block;line-height:1}.logo small{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600;text-transform:uppercase}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-d);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.hl{border-color:var(--brass);box-shadow:inset 4px 0 0 var(--brass)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.active{background:#E4ECEE;color:var(--ink)}.pill.done{background:var(--ok-t);color:var(--ok)}.pill.wait{background:var(--warn-t);color:var(--warn)}
.when{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}.when b{font-size:18px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.chk:first-child{border-top:0}.chk input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--ink)}.chk.on span{color:var(--muted);text-decoration:line-through}
.ctx{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:46px}
.btn.sec{background:transparent;color:var(--ink)}.btn.sm{padding:7px 12px;min-height:38px;font-size:14px}.btn:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:10px;flex-wrap:wrap}
textarea,input[type=text]{font:inherit;font-size:16px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff}
textarea{min-height:80px}
.gantt{display:flex;flex-direction:column;gap:8px}
.gl{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.gl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:18px;background:var(--soft);border-radius:4px}
.seg{position:absolute;top:2px;bottom:2px;border-radius:3px;background:var(--ink)}.seg.o{background:#C9D1D4}
.today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.ticks{position:relative;height:16px;font-size:11.5px;color:var(--muted)}.ticks span{position:absolute;transform:translateX(-50%)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.row:first-child{border-top:0}
.docs a{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);text-decoration:none;font-size:14.5px;overflow-wrap:anywhere}
.docs{display:flex;flex-direction:column;gap:6px}
.ext{font-size:11px;font-weight:700;background:var(--soft);padding:1px 6px;border-radius:4px}
.thread{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.bub{max-width:88%;background:var(--soft);border-radius:12px;padding:9px 12px;font-size:15px;align-self:flex-end;display:flex;flex-direction:column;gap:4px}
.bub.gt{align-self:flex-start;background:#E4ECEE}.bub .mh{font-size:12px;color:var(--muted)}
.msg{background:var(--ok-t);color:var(--ok);padding:12px 14px;border-radius:10px;font-weight:600}
.err{background:#FBE9E7;color:var(--bad);padding:12px 14px;border-radius:10px;font-weight:600}
.note{font-size:13px;color:var(--muted)}
@media (max-width:560px){.gl{grid-template-columns:minmax(0,1fr);gap:3px}.actions .btn{flex:1 1 auto}}
.sig{display:block;width:100%;height:170px;border:1.5px dashed #B9C3C6;border-radius:10px;background:#fff;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<style>.gth{position:sticky;top:0;z-index:40;background:rgba(244,243,239,.96);backdrop-filter:blur(8px);border-bottom:1px solid #DCE2E4;font-family:inherit}.gth .gw{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}.gth .gb{display:flex;align-items:center;gap:10px;text-decoration:none;color:#0F2B36}.gth .gb b{font-size:18px;font-weight:800;display:block;line-height:1}.gth .gb small{display:block;font-size:10px;letter-spacing:.14em;color:#56656D;font-weight:600;margin-top:3px;text-transform:uppercase}.gth nav{display:flex;gap:18px;margin-left:auto;font-weight:600;font-size:14.5px}.gth nav a{text-decoration:none;color:#0F2B36;white-space:nowrap}.gth nav a:hover{color:#8A6430}.gth nav a[aria-current]{color:#8A6430}@media (max-width:860px){.gth .gw{flex-wrap:wrap;gap:8px;padding:8px 16px}.gth nav{margin-left:0;width:100%;overflow-x:auto;gap:6px;padding-bottom:2px}.gth nav a{padding:5px 11px;border:1px solid #DCE2E4;border-radius:99px;background:#fff;font-size:13.5px}.gth nav a[aria-current]{background:#0F2B36;color:#fff;border-color:#0F2B36}}</style><header class="gth"><div class="gw"><a class="gb" href="index.html" aria-label="GeneralTeam – kezdőlap"><svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true" style="display:block;flex:none"><rect width="48" height="48" rx="8" fill="#0F2B36"/><path d="M9 18L24 9l15 9" fill="none" stroke="#C49A5C" stroke-width="3" stroke-linecap="square"/><path d="M21 24H12v15h9v-7h-4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="square"/><path d="M26 24h12M32 24v15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="square"/></svg><span><b>General<span style="color:#8A6430">Team</span></b><small>Alvállalkozói felület</small></span></a><nav aria-label="Fő menü"><a href="index.html">Kezdőlap</a><a href="szolgaltatasok.html">Szolgáltatások</a><a href="szakagak.html">Szakágak</a><a href="referenciak.html">Referenciák</a><a href="belsoepiteszet.html">Belsőépítészet</a><a href="index.html#ajanlatkeres">Ajánlatkérés</a><a href="belepes.html" data-keep="1" aria-current="page">Fiókom</a></nav></div></header>
<div class="wrap">
  <div id="app"><p class="muted">Betöltés…</p></div>
</div>
<script>
(function(){
var API='https://script.google.com/macros/s/AKfycbxYgeSJEPj4zQlQoxu1woLnLV8YQdEm2bXwhjzd2IbayPJULP6pmNfQOj3PonUnmEnA/exec';
var Q={};location.search.replace(/^\?/,'').split('&').forEach(function(x){if(!x)return;var a=x.split('=');Q[decodeURIComponent(a[0])]=decodeURIComponent((a[1]||'').replace(/\+/g,' '))});
function call(fn,args){return fetch(API,{method:'POST',body:JSON.stringify({ten:'gt',fn:fn,args:args}),credentials:'omit',redirect:'follow'}).then(function(r){return r.json()}).then(function(j){if(j&&j.err)throw new Error(j.err);return j.res})}
var app=document.getElementById('app'),D=null,flash='',UI={files:[],open:{}};
var HU=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'],NAP=['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
function pd(s){var a=String(s).split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function fd(s){if(!s)return '';var d=pd(s);return HU[d.getMonth()]+' '+d.getDate()+'.'}
function fdn(s){if(!s)return '';var d=pd(s);return fd(s)+' ('+NAP[d.getDay()]+')'}
function ft(n){return Math.round(n).toLocaleString('hu-HU').replace(/\s/g,' ')+' Ft'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function doc(f){var nm=esc(f[0])+(f[1]?'.'+esc(f[1]):'');return f[2]?'<a href="'+esc(f[2])+'" target="_blank" rel="noopener"><span class="ext">'+esc((f[1]||'').toUpperCase()||'FÁJL')+'</span>'+nm+'</a>':'<a><span class="ext">FÁJL</span>'+nm+'</a>'}
var STL={todo:['Hátravan',''],active:['Folyamatban','active'],wait:['Átvételre vár','wait'],done:['Kész, átvéve','done']};
var TODAY=new Date();TODAY.setHours(0,0,0,0);
function gantt(){var m=D.munkak.filter(function(x){return x.kezd});if(!m.length)return '';var rows=[];m.forEach(function(x){(x.elozo||[]).forEach(function(e){rows.push([e.t,null,e.vege,1])});rows.push([x.t,x.kezd,x.vege,0])});
  var A=null,B=null;rows.forEach(function(r){var a=pd(r[1]||r[2]),b=pd(r[2]);if(!A||a<A)A=a;if(!B||b>B)B=b});A=new Date(A);A.setDate(A.getDate()-4);B=new Date(B);B.setDate(B.getDate()+4);var sp=(B-A)||1,x=function(d){return Math.max(0,Math.min(100,(d-A)/sp*100)).toFixed(2)+'%'};
  var h='<div class="gantt">';rows.forEach(function(r){var a=r[1]?pd(r[1]):new Date(pd(r[2]).getTime()-2*864e5),b=pd(r[2]);b=new Date(b.getTime()+864e5);h+='<div class="gl"><span'+(r[3]?' class="muted"':'')+'>'+esc(r[0])+(r[3]?' (előzmény)':'')+'</span><div class="track"><div class="seg'+(r[3]?' o':'')+'" style="left:'+x(a)+';width:calc('+x(b)+' - '+x(a)+')"></div>'+(TODAY>=A&&TODAY<=B?'<div class="today" style="left:'+x(TODAY)+'"></div>':'')+'</div></div>'});
  h+='<div class="gl"><span></span><div class="ticks">';var d=new Date(A);d.setDate(d.getDate()+1);var n=0;while(d<B&&n<60){if(d.getDay()===1)h+='<span style="left:'+x(d)+'">'+fd(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())+'</span>';d.setDate(d.getDate()+1);n++}
  return h+'</div></div></div>'}
function render(){var h='';
  if(flash)h+='<div class="msg" role="status">'+esc(flash)+'</div>';
  h+='<div><span class="tag">'+esc(D.projekt.hely||'')+'</span><h1>'+esc(D.projekt.nev)+'</h1><p class="muted">Szia, '+esc(D.en.nev)+'! Itt látod a rád vonatkozó munkákat, határidőket és mérföldköveket'+(D.en.szakag?' ('+esc(D.en.szakag)+')':'')+'.</p></div>';
  if(D.projekt.elo==='ajanlat')h+='<div class="card hl"><span class="tag">Tervezett ütemezés</span><p>A megrendelő még nem rendelte meg véglegesen a munkát, a dátumok egyeztetés alatt állnak. Ha véglegesedik, szólunk, és itt is frissül.</p></div>';
  var IU='https://script.google.com/macros/s/AKfycbxYgeSJEPj4zQlQoxu1woLnLV8YQdEm2bXwhjzd2IbayPJULP6pmNfQOj3PonUnmEnA/exec?ics=1&ten=gt&pid='+encodeURIComponent(Q.pid)+'&a='+encodeURIComponent(Q.t),WC=IU.replace(/^https:/,'webcal:');
  window.__iu=IU;
  var PRE=D.projekt.elo==='ajanlat';
  if(D.szk){var zd=D.szk,zs=zd.st;h+='<div class="card'+(zs==='alairas'&&!zd.al?' hl':'')+'"><span class="tag">Szerződés</span>'+(zd.megszunt?'<p class="note">A szerződésed '+esc(zd.megszunt.d)+' napjától az átadott munkák tekintetében megszűnt. A már elvégzett munkát elszámoljuk.</p>':'');
    if(zs==='aktiv'&&zd.gt)h+='<h2>A szerződés hatályos</h2><p>Minden érintett fél aláírta ('+esc(zd.gt.ts)+').</p>'+(zd.pdf?'<a class="btn" href="'+esc(zd.pdf)+'" target="_blank" rel="noopener">Aláírt szerződés (PDF)</a>':'')+'<p class="muted" style="font-size:14px">A PDF az aláírási naplóval együtt érvényes. Ha szeretnéd, AVDH-val (magyarorszag.hu – Dokumentum hitelesítése, Ügyfélkapu+ / DÁP) vagy e-Szignóval külön is hitelesítheted, és a hitelesített példányt fájlként elküldheted; helyszíni találkozón kézzel is aláírhatjuk.</p>'+((zd.hit||[]).length?'<p style="font-size:14px"><b>Hitelesített / kézzel aláírt példány:</b><br>'+zd.hit.map(function(f){return '<a href="'+esc(f[2])+'" target="_blank" rel="noopener">'+esc(f[0]+(f[1]?'.'+f[1]:''))+'</a>'}).join('<br>')+'</p>':'');
    else if(zs==='alairas'&&zd.al)h+='<h2>Aláírtad</h2><p class="muted">'+esc(zd.al.ts)+'. A GeneralTeam akkor ír alá, amikor minden fél aláírt – ekkor lép hatályba, és e-mailben megkapod a PDF-et.</p><button class="btn sec" data-szkopen="1" style="align-self:flex-start">Szöveg</button>';
    else if(zs==='alairas')h+='<h2>Aláírásra vár</h2><p>Olvasd el, és írd alá. A GeneralTeam utolsóként ír alá, amikor minden fél aláírt.</p><div style="max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;font-size:14px">'+zd.html+'</div><label class="muted" for="sz_n" style="font-size:14px">Teljes név (cégnél a képviselő neve)</label><input type="text" id="sz_n" value="'+esc(D.en.nev||'')+'"><label class="muted" style="font-size:14px">Aláírás</label><canvas id="sigu" class="sig" aria-label="Aláírás helye"></canvas><label style="font-size:13px;cursor:pointer;text-decoration:underline;color:inherit;display:inline-block;margin-top:4px">vagy aláírás feltöltése képből (fotó a papíron lévő aláírásodról)<input type="file" accept="image/*" data-sigup="1" hidden></label><label class="chk"><input type="checkbox" id="sz_ok"><span>A szerződést elolvastam, a tartalmát megértettem és elfogadom.</span></label><div class="actions"><button class="btn" data-szka="1">Aláírom</button><button class="btn sec" data-sclr="1">Aláírás törlése</button></div>';
    else h+='<h2>Szerződéstervezet</h2><p>Nézd át. Ha rendben van, hagyd jóvá; ha mást kérsz, írd meg lent üzenetben.'+(zd.jov?' <b>Jóváhagytad: '+esc(zd.jov)+'.</b>':'')+'</p><div class="actions"><button class="btn sec" data-szkopen="1">Tervezet megnyitása</button>'+(zd.jov?'':'<button class="btn" data-szkjov="1">Jóváhagyom a tervezetet</button>')+'</div>';
    h+='</div>'}
  /* munkák */
  D.munkak.forEach(function(m){var s=STL[m.st]||STL.todo,done=m.del.filter(function(x){return x.on}).length,lezart=m.st==='done';
    h+='<div class="card'+(m.st==='active'?' hl':'')+'"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><h2>'+esc(m.t)+'</h2><span class="pill '+s[1]+'">'+s[0]+'</span></div>';
    h+='<div class="when"><div><span class="muted">Kezdés</span><br><b>'+fdn(m.kezd)+'</b></div><div><span class="muted">Befejezés</span><br><b>'+fdn(m.vege)+'</b></div><div><span class="muted">Kész</span><br><b>'+done+'/'+m.del.length+'</b></div></div>';
    if((m.elozo||[]).length||(m.kov||[]).length)h+='<div class="ctx">'+(m.elozo||[]).map(function(e){return '<span>Előtte: <b>'+esc(e.t)+'</b> – '+(e.kesz?'kész':'várhatóan kész: '+fd(e.vege))+'</span>'}).join('')+(m.kov||[]).map(function(e){return '<span>Utána: <b>'+esc(e.t)+'</b> – kezdés: '+fd(e.kezd)+'</span>'}).join('')+'</div>';
    h+='<div>'+m.del.map(function(x,j){return '<label class="chk'+(x.on?' on':'')+'"><input type="checkbox" data-chk="'+esc(m.k)+'|'+j+'"'+(x.on?' checked':'')+(lezart||PRE?' disabled':'')+'><span>'+esc(x.t)+'</span></label>'}).join('')+'</div>';
    if((m.docs||[]).length)h+='<div class="docs">'+m.docs.map(doc).join('')+'</div>';
    if(PRE)h+='<p class="note">A munkarészek a szerződések aláírása után jelölhetők készre.</p>';else if(m.kesz)h+='<p class="note">Készre jelentetted: '+esc(m.kesz)+'. Ellenőrzés után átvesszük.</p>';
    else if(!lezart)h+=(UI.open[m.k]?'<textarea id="kj_'+esc(m.k)+'" placeholder="Megjegyzés (nem kötelező), pl. a lábazat holnap délelőtt szárad ki"></textarea><div class="actions"><button class="btn" data-jel="'+esc(m.k)+'">Készre jelentés elküldése</button><button class="btn sec" data-nyit="'+esc(m.k)+'">Mégse</button></div>':'<div class="actions"><button class="btn sec" data-nyit="'+esc(m.k)+'">Készre jelentem</button></div>');
    h+='</div>'});
  if(!D.munkak.length)h+='<div class="card"><p class="muted">Ebben a projektben még nincs hozzád rendelt munka.</p></div>';
  /* építési napló */
  var NL=(D.naplo||[]).slice().reverse();
  h+='<div class="card"><h2>Építési napló</h2><p class="muted" style="font-size:14px">Írd le röviden, mi készült, hányan voltatok, és tölts fel fotót. Ha valami akadályozza a munkát (pl. nincs anyag, nem száradt ki, nem lehet bejutni), jelöld be – Benkő Ádám azonnal értesítést kap.</p>';
