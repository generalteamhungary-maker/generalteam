    Promise.all(fl.map(function(f){return new Promise(function(res,rej){if(f.size>20*1024*1024){rej(new Error('Túl nagy fájl (max. 20 MB): '+f.name));return}var r=new FileReader();r.onload=function(){res({n:f.name,t:f.type,b64:String(r.result).split(',')[1]})};r.onerror=rej;r.readAsDataURL(f)})}))
    .then(function(arr){return call('alvUzenet',[Q.pid,Q.t,tx,arr])}).then(function(r){UI.mt='';UI.files=[];ok(r,'Üzenet elküldve.')},fail)}});
if(!Q.pid||!Q.t){app.innerHTML='<div class="err">Hiányos link. Kérd el újra Benkő Ádámtól.</div>';return}
call('alvBetolt',[Q.pid,Q.t]).then(function(r){ok(r)},function(e){app.innerHTML='<div class="err">'+esc(e&&e.message||e)+'</div>'});
})();
</script>
