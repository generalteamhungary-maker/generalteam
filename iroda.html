<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeneralTeam iroda</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: bal oldali menü + munkaterület; a projekt nézet egy idővonal (fázisok) + részletpanel */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --fg:#0F1D26; --muted:#56656D; --line:#DCE2E4; --soft:#EEF1EF;
  --brand:#0F2B36; --brand-tint:#E4ECEE; --on-brand:#FFFFFF; --brass:#C49A5C; --brass-tint:#F6EEDF;
  --ok:#1F7A4D; --ok-tint:#E3F2EA; --warn:#9A5B00; --warn-tint:#FDF1DF; --bad:#B3261E; --bad-tint:#FBE9E7;
  --display:'Archivo',system-ui,sans-serif; --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html,:root[data-theme]{color-scheme:light}
#mob{display:none}
@media (max-width:860px){
  #mob{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:60;padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
  #mob button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--muted);padding:4px 0;position:relative}#mob button .ic{font-size:18px;line-height:1.2}#mob button[aria-current]{color:var(--brand);font-weight:700}
  #mob .cnt{position:absolute;top:0;right:16%;background:var(--brass);color:#2B1B00;border-radius:99px;font-size:10px;font-weight:700;padding:0 5px}
  .side{display:none}.main{padding:12px 12px 90px}.bar h1{font-size:21px}.gantt.pf .lab{grid-template-columns:auto minmax(0,1fr)}.gantt.pf .lab .dl{display:none}
  .card{padding:12px;border-radius:8px}.mini.c2{grid-template-columns:minmax(0,1fr)}.btn{padding:9px 12px}.row{grid-template-columns:minmax(0,1fr)}.row .evr{justify-content:flex-start}
  .ptabs{overflow-x:auto;flex-wrap:nowrap}.ptabs button{white-space:nowrap}
}

.hdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;background:var(--muted)}.hdot.ok{background:var(--ok)}.hdot.warn{background:#D9A400}.hdot.bad{background:var(--bad)}
.p-brass{background:var(--brass-tint);color:#7A5A2A}
.qsbtn{display:flex;justify-content:space-between;align-items:center;background:var(--soft)!important;border:1px solid var(--line)!important;color:var(--muted)!important;margin-bottom:8px;font-weight:500!important}.qsbtn .kbd{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#qs{position:fixed;inset:0;background:rgba(15,43,54,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px}
#qs .qsb{background:var(--surface);border-radius:12px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);padding:12px;max-height:70vh;overflow:auto}
#qs input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:16px}
#qs .row.sel{background:var(--brand-tint);border-radius:8px;padding-left:8px;padding-right:8px}
.gantt.pf .lab{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0}.lnkb{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--brand);cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lnkb:hover{text-decoration:underline}
.ptabs button .hdot{margin-right:6px}
.la{display:grid;gap:10px}.lad{border-top:1px solid var(--line);padding-top:8px}.lah{font-weight:700;font-size:13.5px;margin-bottom:4px}.lah.today{color:var(--brand)}.lar{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:14px;padding:3px 0 3px 10px;border-left:3px solid var(--line)}.lar.k-start{border-color:var(--brand)}.lar.k-end{border-color:var(--ok)}.lar.k-pay{border-color:var(--brass)}.lar.k-ev{border-color:#D9A400}.lat{font-weight:600}.las{color:var(--muted);font-size:13px}.lar .lnkb{font-size:13px;font-weight:500;margin-left:auto}
.row.todo .snz{display:none;gap:3px}.row.todo:hover .snz{display:inline-flex}.row.todo .snz .xbtn{font-size:11px;font-weight:600;width:auto;padding:0 6px;height:22px;border-radius:5px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;gap:10px;align-items:center}
.brand b{font-family:var(--display);font-size:17px;display:block;line-height:1.1}
.brand small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;border:0;border-radius:7px;padding:9px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.menu button:hover{background:var(--soft);color:var(--fg)}
.menu button[aria-current="page"]{background:var(--brand-tint);color:var(--brand);font-weight:600}
.menu .cnt{font-size:11.5px;background:var(--brass);color:#2B1B00;border-radius:99px;padding:0 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.pro{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;background:var(--brand);color:var(--on-brand);border-radius:4px;padding:1px 6px;vertical-align:1px}
.main{padding:22px 26px 60px;min-width:0;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.demo{font-size:12.5px;background:var(--brass-tint);color:var(--warn);border-radius:6px;padding:6px 10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:7px;padding:8px 14px;border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn.sec{background:transparent;color:var(--brand)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi b{font-family:var(--display);font-size:26px;display:block}
.kpi span{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-tint);color:var(--ok)}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-bad{background:var(--bad-tint);color:var(--bad)}
.p-info{background:var(--brand-tint);color:var(--brand)}
.p-mute{background:var(--soft);color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
/* projekt */
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:500}
.ptabs button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand);font-weight:600}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.gantt{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.gl{display:grid;grid-template-columns:200px minmax(420px,1fr);gap:10px;align-items:center;font-size:13px}
.gl .lab{display:flex;gap:6px;align-items:center;min-width:0}
.gl .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:22px;background:var(--soft);border-radius:4px}
.seg{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--line)}
.seg.done{background:var(--ok)}
.seg.active{background:var(--brand)}
.seg.wait{background:var(--brass)}
.brk{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--muted) 28%,transparent) 4px 6px)}
.today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.axis{display:grid;grid-template-columns:200px minmax(420px,1fr);gap:10px;font-size:11px;color:var(--muted)}
.axis .ticks{position:relative;height:16px}
.axis .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.phases{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.plist{display:flex;flex-direction:column;gap:6px;position:relative;max-height:min(80vh,980px);overflow-y:auto;padding:2px 6px 2px 2px;overscroll-behavior:contain}
@media(min-width:641px){.plist{position:sticky;top:12px;align-self:start}}
@media(max-width:640px){.plist{max-height:330px}}
.plist button{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;cursor:pointer;align-items:start}
.plist button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.dot.done{background:var(--ok);color:#fff}.dot.active{background:var(--brand);color:var(--on-brand)}.dot.wait{background:var(--brass);color:#2B1B00}
.plist .pt{font-weight:600;font-size:14px}
.plist .ps{font-size:12px;color:var(--muted)}
.plist button.skip{border-style:dashed;background:transparent}
.plist button.skip .pt{color:var(--muted);font-weight:500}
.plist .sep{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 2px 2px}
.req-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;background:var(--soft);color:var(--muted);border-radius:4px;padding:1px 6px;margin-left:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{margin-top:3px;accent-color:var(--ok);width:16px;height:16px}
.chk.on span{color:var(--muted);text-decoration:line-through}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.counter{display:flex;align-items:center;gap:8px;font-size:13.5px}
.counter .bx{display:flex;gap:3px}
.counter .bx i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--brand)}
.counter .bx i.on{background:var(--brand)}
.counter .bx i.x{border-color:var(--bad);background:var(--bad)}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;gap:10px;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.doc .ext{font-family:var(--mono);font-size:11px;background:var(--soft);border-radius:4px;padding:1px 5px}
/* megkeresések */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:13px;display:flex;justify-content:space-between;color:var(--muted);font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.lead b{font-size:14.5px}
/* ajánlat */
.offer{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{font-weight:400;font-size:14px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
.mod{display:grid;grid-template-columns:22px minmax(0,1fr) 120px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mod input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.mod small{display:block;color:var(--muted);font-size:12px}
.paper{background:#FFFFFF;color:#1F2328;border:1px solid var(--line);border-radius:4px;padding:28px 30px;display:flex;flex-direction:column;gap:14px;font-size:13px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.paper h2{font-family:var(--body);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#1F2328}
.paper .hdr{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#5A6168;border-bottom:1px solid #1F2328;padding-bottom:10px}
.paper table{font-size:12.5px;color:#1F2328}
.paper td,.paper th{border-color:#E1E4E6;color:#1F2328}
.paper .tot td{font-weight:700;border-top:1.5px solid #1F2328}
.paper ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.paper .small{font-size:11.5px;color:#5A6168}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:30}
.mtop{display:none}
.g3e{grid-template-columns:repeat(3,minmax(0,1fr))}
.box{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.box.warn{background:var(--warn-tint);color:#5c3a00}
.box b{font-weight:600}
.mini{display:grid;gap:8px}
.mini.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mini.c3{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
.lnk{color:var(--brand);font-weight:600;text-decoration:none;font-size:13px;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.evr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.xbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:4px}
.xbtn:hover{background:var(--bad-tint);color:var(--bad)}
.lead details{border-top:1px dashed var(--line);padding-top:6px}
.lead summary{cursor:pointer;font-size:12.5px;color:var(--brand);font-weight:600}
.lead textarea{min-height:60px;font-size:13px}
.lfile{display:flex;gap:6px;align-items:center;font-size:12.5px;overflow-wrap:anywhere}
.chg{font-size:11px;font-weight:700;color:var(--warn);margin-left:4px}
textarea{min-height:70px;resize:vertical}
.thread{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow:auto;padding:4px 2px}
.bub{max-width:80%;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px;align-self:flex-start;display:flex;flex-direction:column;gap:4px}
.bub.me{align-self:flex-end;background:var(--brand-tint)}
.bub .mh{font-size:11.5px;color:var(--muted)}
input[type=time]{font-weight:400;font-size:14px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
@media (max-width:1100px){.g3e{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.offer{grid-template-columns:minmax(0,1fr)}.phases{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .menu{flex-direction:row;overflow-x:auto;gap:4px}
  .menu button{white-space:nowrap}
  .side .foot{display:none}
  .main{padding:16px 16px 60px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.paper{padding:18px}}
@media (max-width:640px){
  .main{overflow-x:hidden;gap:16px}
  .gantt{overflow:visible}
  .gl,.axis{grid-template-columns:minmax(0,1fr);gap:3px}
  .gl .lab{font-size:12.5px}
  .axis>span:first-child{display:none}
  .mini.c2,.mini.c3{grid-template-columns:minmax(0,1fr)}
  .head{flex-direction:column;gap:8px}
  .row{grid-template-columns:minmax(0,1fr)}
  .bub{max-width:94%}
  .kanban{grid-template-columns:repeat(4,minmax(260px,84vw));scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .card{padding:14px}
  h1{font-size:23px}
  .meta{gap:6px 14px}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{font-size:16px}
  .menu button{padding:8px 10px}
  .btn{white-space:normal;text-align:left}
  .side{position:sticky;top:0;z-index:20;padding:10px 12px}
  .side .brand small{display:none}
  .toast{left:12px;right:12px;transform:none;text-align:center}
}
.grp{border-top:1px solid var(--line);padding:6px 0}
.grp>summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;list-style:none;padding:6px 0;flex-wrap:wrap}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary b::before{content:"▸ ";color:var(--muted)}
.grp[open]>summary b::before{content:"▾ "}

}

  var z=p.szk;if(z){var d=m?z.docs.filter(function(q){return q.tip==='u'&&q.f&&q.f.mid===m.id})[0]:z.docs.filter(function(q){return q.tip==='u'})[0];if(d){if(z.st==='draft'&&d.kuldve&&!d.jov)need.push('Szerződéstervezet jóváhagyása a portálon');if(z.st==='alairas'&&!d.al&&!d.kesobb)need.push('Szerződés aláírása a portálon')}}

  var rows=[],S0={bev:0,kot:0,kif:0};TPL.forEach(function(t,i){var g=G[t.k];if(!g||p.phases[i].st==='skip')return;var m=g.bev-g.kot;rows.push({t:t.t,k:t.k,bev:g.bev,kot:g.kot,kif:g.kif,m:m});S0.bev+=g.bev;S0.kot+=g.kot;S0.kif+=g.kif});

function gtImport(){if(!S||!S.projects)return;S.imp=S.imp||{};if((S.imp.bodajk28&&S.imp.bodajk28u1&&S.imp.bodajk28u2)||gtImport.busy||!CFG.k||!window.crypto||!crypto.subtle)return;gtImport.busy=1;
  var b=GTIMP.split('.').map(function(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})});
  crypto.subtle.importKey('raw',new TextEncoder().encode(CFG.k),'PBKDF2',false,['deriveKey']).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b[0],iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])})
  .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b[1]},k,b[2])}).then(function(buf){var src=new TextDecoder().decode(buf);eval(src);render()})
  .catch(function(){gtImport.busy=0})}
/* ===== v9: tételes ajánlat + tételtár, kezdés/befejezés módosítása, megrendelés előtti szakasz, partnerek kezelése, naptár-feliratkozás ===== */
function itTot(x){return (x.a!=null||x.d!=null)?Math.round((+x.q||0)*((+x.a||0)+(+x.d||0))):(+x.tot||0)}
function q1(v){return (Math.round((+v||0)*10)/10).toFixed(1).replace('.',',')}
/* ---- tételtár ---- */
function tetelek(){S.tetelek=S.tetelek||[];return S.tetelek}
function tNorm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()}
function tFind(nev){var n=tNorm(nev);return tetelek().filter(function(x){return tNorm(x.t)===n})[0]}
function tLast(x){return (x.h||[])[x.h.length-1]||{}}
function tAdd(it,k,src,dt){if(!it||!String(it.t||'').trim())return;var x=tFind(it.t);
  if(!x){x={id:'t'+Date.now().toString(36)+Math.floor(Math.random()*1e4),t:String(it.t).trim(),u:it.u||'',k:k||'',h:[]};tetelek().push(x)}
  if(it.u)x.u=it.u;if(k&&!x.k)x.k=k;
  var l=tLast(x);if(l.a===(+it.a||0)&&l.d===(+it.d||0)&&l.src===src)return;
  x.h.push({a:+it.a||0,d:+it.d||0,src:src||'',dt:dt||iso(TODAY)});if(x.h.length>30)x.h=x.h.slice(-30)}
function tLabel(x){var l=tLast(x);return ft(l.a||0)+' + '+ft(l.d||0)+(x.u?' /'+x.u:'')+(l.src?' · '+l.src:'')+(l.dt?' · '+fd(pd(l.dt)):'')}
function tDatalist(){return '<datalist id="tetlist">'+tetelek().map(function(x){return '<option value="'+esc(x.t)+'" label="'+esc(tLabel(x))+'"></option>'}).join('')+'</datalist>'}
function itEditor(k){var it=OF.items[k]||[],h='<div class="items">';
  if(it.length){h+='<div class="ithd"><span>Anyag Ft/egys.</span><span>Díj Ft/egys.</span><span>Menny.</span><span>Egys.</span><span>Opció</span><span></span></div>';
    it.forEach(function(x,i){var id=k+'|'+i,tx=tFind(x.t),hist=tx&&tx.h&&tx.h.length?tx.h.slice(-3).reverse().map(function(y){return ft(y.a)+' + '+ft(y.d)+' · '+esc(y.src||'')+' · '+fd(pd(y.dt))}).join('<br>'):'';
      h+='<div class="itrow'+(x.opt?' opt':'')+'"><input type="text" list="tetlist" data-it="'+id+'|t" value="'+esc(String(x.t||'').replace(/\n/g,' '))+'" placeholder="Kezdd el gépelni – korábbi tételeket ajánl" aria-label="Tétel" title="'+esc(x.t||'')+'">'+
        '<input type="number" step="1" data-it="'+id+'|a" value="'+(x.a!=null?x.a:'')+'" aria-label="Anyagár"><input type="number" step="1" data-it="'+id+'|d" value="'+(x.d!=null?x.d:(x.tot&&x.q?Math.round(x.tot/x.q):''))+'" aria-label="Munkadíj"><input type="number" step="0.1" data-it="'+id+'|q" value="'+(x.q||0)+'" aria-label="Mennyiség"><input type="text" data-it="'+id+'|u" value="'+esc(x.u||'')+'" aria-label="Egység" style="width:60px">'+

var GT_CEG={nev:'General Contractor Team Kft.',szh:'2051 Biatorbágy, Nimród utca 30.',cg:'01 09 204112',ado:'25174032-2-13',kep:'Benkő Ádám ügyvezető'};

function szkHtmlU0(p,f){var e=esc,tot=p.pays.reduce(function(a,y){return a+(+y.amt||0)},0),o=p.offer||{},rev=o.rev;
  var rows='';TPL.forEach(function(t,i){if(p.phases[i].st==='skip'||t.k==='felm')return;var a=o.amts?o.amts[t.k]:null;rows+='<tr><td>'+e(t.t)+'</td><td style="text-align:right">'+(a!=null?hufmt(a):'')+'</td></tr>'});

  var pay=p.pays.map(function(y,i){return '<tr><td>'+(i+1)+'. '+e(y.t)+'</td><td style="text-align:right">'+hufmt(y.amt)+' + áfa</td></tr>'}).join('');
  return '<h1 style="text-align:center">Vállalkozási szerződés</h1><p>mely létrejött egyrészről <b>'+e(f.megr)+'</b>'+(f.cim?' (lakcím / székhely: '+e(f.cim)+(f.azon?'; '+e(f.azon):'')+(f.ado?'; adószám: '+e(f.ado):'')+')':'')+' – a továbbiakban: <b>Megrendelő</b> –, másrészről a <b>'+GT_CEG.nev+'</b> (székhely: '+GT_CEG.szh+'; cégjegyzékszám: '+GT_CEG.cg+'; adószám: '+GT_CEG.ado+'; képviseli: '+GT_CEG.kep+') – a továbbiakban: <b>Vállalkozó</b> – (a továbbiakban együtt: Szerződő felek) között az alulírott helyen és napon, az alábbi feltételekkel.</p>'+
   '<h2>1. A vállalkozás tárgya, határidők</h2><p>1.1. A vállalkozás tárgya: <b>'+e(f.targy)+'</b>'+(f.hely?', a munkavégzés helye: '+e(f.hely):'')+'. A munka műszaki tartalmát a Vállalkozó '+(o.d?fdl(pd(o.d))+' kelt ':'')+'tételes árajánlata (1. melléklet) határozza meg, az alábbi munkanemekkel. Az ajánlat opciós tételei csak a Megrendelő külön megrendelése alapján képezik a szerződés részét.</p><table>'+rows+'</table>'+
   '<p>1.2. Kezdés: <b>'+fdl(pd(f.kezd))+'</b>. Befejezés (átadás-átvétel): <b>'+fdl(pd(f.veg))+'</b>. '+(f.utem?e(f.utem)+' ':'')+'A részhatáridőket az alábbi ütemterv tartalmazza (2. melléklet); a GeneralTeam ügyfélportálon mindig a felek által elfogadott, aktuális ütemterv látható.</p>'+szkUtemRows(p)+
   '<p>1.3. A Vállalkozó a megbízást a szerződés aláírásával elfogadja, és kijelenti, hogy jogosult és képes a munka elvégzésére. A Vállalkozó alvállalkozót vehet igénybe, akiért úgy felel, mintha a munkát maga végezte volna.</p>'+
   '<h2>2. Vállalkozói díj, fizetési feltételek</h2><p>2.1. A vállalkozói díj nettó <b>'+hufmt(tot)+'</b>, amelyhez '+(rev?'– fordított adózás alapján – az áfát a Megrendelő fizeti meg':'a mindenkor hatályos áfa (jelenleg 27%) járul')+'.</p><p>2.2. A díj megfizetése az alábbi ütemezés szerint, a Vállalkozó által kiállított számla alapján, annak kézhezvételétől számított 8 napon belül, banki átutalással történik:</p><table>'+pay+'</table>'+
   '<p>2.3. Fizetési késedelem esetén a Megrendelő a Ptk. 6:155. §-a szerinti késedelmi kamatot fizeti.</p><p>2.4. A vállalkozói díjon felül a Megrendelő más jogcímen fizetésre nem köteles. Az előre nem látható többlet- és pótmunkát a Vállalkozó csak a Megrendelő előzetes, írásbeli – a GeneralTeam ügyfélportálon tett – jóváhagyásával végezheti el; díja és az esetleges határidő-módosítás a jóváhagyással válik a szerződés részévé.</p>'+
   (function(){var pc=(f.tartalek==null||f.tartalek==='')?10:(+String(f.tartalek).replace(',','.')||0);return pc?'<p>2.5. Tartalékkeret: a felek a vállalkozói díjon és az opciós tételeken felül a nettó vállalkozói díj '+e(String(pc).replace('.',','))+'%-ának megfelelő, nettó '+hufmt(Math.round(tot*pc/100))+' összegű tartalékkeretet határoznak meg. A tartalékkeret kizárólag műszakilag indokolt, előre nem látható munkákra használható fel, minden esetben a Megrendelő előzetes, írásbeli – az ügyfélportálon is megadható – beleegyezésével. A fel nem használt tartalékkeret a Megrendelőt nem terheli, és nem számlázható.</p>':''})()+'<h2>3. A felek jogai és kötelezettségei</h2><p>3.1. A Vállalkozó a munkát a szakma szabályai, a vonatkozó jogszabályok, szabványok és technológiai előírások szerint, első osztályú minőségben végzi.</p><p>3.2. A Vállalkozó tájékoztatja a Megrendelőt a munka állásáról, és haladéktalanul minden olyan körülményről, amely a határidőben és megfelelő minőségben történő teljesítést veszélyezteti.</p><p>3.3. A Megrendelő biztosítja a munkaterület akadálytalan megközelítését, az ideiglenes víz- és energiavételt, és a szükséges döntéseket (anyagválasztás, jóváhagyások) időben meghozza. Ha a Megrendelő által biztosítandó anyag, döntés, jóváhagyás vagy munkaterület késve áll rendelkezésre, a határidők a késés idejével, valamint az ebből eredő átszervezés idejével meghosszabbodnak.</p><p>3.4. Ha a Megrendelő célszerűtlen vagy szakszerűtlen utasítást ad, a Vállalkozó köteles őt erre figyelmeztetni.</p><p>3.5. A Vállalkozó betartja és alvállalkozóival betartatja a munkavédelmi és munkabiztonsági előírásokat; ha jogszabály előírja, elektronikus építési naplót vezet.</p><p>3.6. A Megrendelő a munkát ellenőrizheti, de a Vállalkozó tevékenységét nem akadályozhatja.</p><p>3.7. A Vállalkozó a művet átadás-átvételi eljárásban adja át. Az átvétel nem tagadható meg olyan hiba miatt, amely – illetve amelynek kijavítása – a rendeltetésszerű használatot nem akadályozza.</p>'+
   '<h2>4. Késedelem, kötbér, módosítás, megszűnés</h2><p>4.1. A felek a befejezési határidőhöz '+e(f.turelem||'15')+' munkanapos türelmi időt kötnek ki. Késedelmi kötbér csak akkor jár, ha a Vállalkozónak felróható késedelem a türelmi időt meghaladja; a kötbér a türelmi idő leteltét követő naptól számítandó, mértéke naponta a nettó vállalkozói díj '+e(f.kotber)+'%-a, legfeljebb '+e(f.kotbermax)+'%-a. A részhatáridők az ütemezést szolgálják, azok elmulasztása önmagában kötbért nem alapoz meg.</p><p>4.2. Nem minősül a Vállalkozónak felróható késedelemnek, és a határidő ennek idejével meghosszabbodik: a Megrendelő érdekkörébe tartozó ok; a munkavégzésre alkalmatlan időjárás (pl. csapadék, fagy, a technológiai előírások szerinti hőmérséklet alatti idő); a bontás során feltárt, előre nem látható állapot; a jóváhagyott pótmunka; a hatósági eljárás, illetve a beszerzési, szállítási akadály, amelyet a Vállalkozó kellő gondossággal sem háríthatott el. A Vállalkozó az ilyen körülményről a Megrendelőt az ügyfélportálon értesíti.</p><p>4.3. A kötbér a Megrendelő késedelemből eredő igényeit – a Vállalkozó szándékos szerződésszegését kivéve – kimeríti.</p><p>4.4. Ha a teljesítés olyan okból válik lehetetlenné, amelyért egyik fél sem felelős, a Vállalkozót az elvégzett munka és felmerült költségei arányában illeti meg díj; a lehetetlenülés egyéb eseteiben a Ptk. szabályai irányadók.</p><p>4.5. A szerződést a felek közös megegyezéssel, írásban – a GeneralTeam ügyfélportálon tett, mindkét fél által elfogadott módosítással is – módosíthatják.</p><p>4.6. A szerződés bármely módon történő megszűnése nem érinti a felek megszűnés előtti jogait és kötelezettségeit; a felek egymással elszámolnak.</p>'+
   '<h2>5. Jótállás, szavatosság</h2><p>5.1. A Vállalkozó a Ptk. és a vonatkozó jogszabályok szerinti jótállással és szavatossággal tartozik, az átadás-átvételi jegyzőkönyvben megjelölt időponttól'+(f.jot?'; a felek által vállalt jótállás időtartama '+e(f.jot)+' hónap, amely a jogszabályban kötelezően előírt hosszabb jótállási időt nem érinti':'')+'.</p><p>5.2. A Vállalkozó a hiba bejelentésétől számított 15 munkanapon belül – ha a javítás technológiája vagy az időjárás ezt nem teszi lehetővé, a műszakilag lehetséges legkorábbi időpontban –, a rendeltetésszerű használatot súlyosan veszélyeztető hiba esetén 5 munkanapon belül megkezdi a javítást. Ha ennek írásbeli felszólítás ellenére sem tesz eleget, a Megrendelő a hibát – a Vállalkozó költségére – mással is kijavíttathatja.</p>'+
   '<h2>6. Vegyes és záró rendelkezések</h2><p>6.1. A felek a kapcsolattartásra elsődlegesen a GeneralTeam ügyfélportált (üzenetek, jóváhagyások, dokumentumok) és az e-mailt használják. A portálon tett jóváhagyások írásbeli nyilatkozatnak minősülnek. Kapcsolattartók – Megrendelő: '+e(f.kapcs)+'; Vállalkozó: Benkő Ádám, +36 70 627 67 06, info@generalteam.hu.</p><p>6.2. A felek vitáikat elsősorban tárgyalás útján rendezik; ennek eredménytelensége esetén '+e(f.birosag)+' jár el.</p><p>6.3. A szerződésben nem szabályozott kérdésekben a Ptk. és a vonatkozó jogszabályok irányadók.</p><p>6.4. A szerződés azon a napon lép hatályba, amelyen mindkét fél aláírta.</p>'+
   (f.egyeb?'<p>6.5. Egyéb megállapodások: '+e(f.egyeb).replace(/\n/g,'<br>')+'</p>':'')+'<p>A felek a szerződést elolvasás és értelmezés után, mint akaratukkal mindenben egyezőt, elektronikusan írják alá; az aláírási napló a szerződés része.</p>'}
function szkHtmlA(p,a,f){var e=esc,keys=a.phases||[],dl='',pays=(a.pays||[]);
  TPL.forEach(function(t,i){if(keys.indexOf(t.k)<0||p.phases[i].st==='skip')return;var x=p.phases[i];dl+='<li><b>'+e(t.t)+'</b>: '+(x.del||t.del).map(e).join('; ')+'</li>'});if(f.munka)dl=String(f.munka).split(/\n+/).filter(function(x){return x.trim()}).map(function(x){return '<li>'+e(x.trim())+'</li>'}).join('');

   '<h2>1. A vállalkozás tárgya, határidők</h2><p>1.1. A vállalkozás tárgya: '+e(p.hely||'')+' – '+e(p.nev)+' munkáin belül a(z) <b>'+e(f.szakag||'szakági')+'</b> munkák elvégzése, az alábbi munkarészekkel'+((a.offer||{}).note?', a Vállalkozó ajánlata szerint ('+e(a.offer.note)+')':'')+':</p><ul>'+dl+'</ul>'+
   '<p>1.2. Kezdés: <b>'+(f.kezd?fdl(pd(f.kezd)):'egyeztetés szerint')+'</b>. Befejezés: <b>'+(f.veg?fdl(pd(f.veg)):'egyeztetés szerint')+'</b>. A Vállalkozó a munkát a Megrendelő által a GeneralTeam alvállalkozói felületen közzétett, mindenkor aktuális ütemterv szerint, az előző és a következő munkafázisokhoz igazodva végzi:</p>'+szkUtemRows(p,keys)+
   '<p>1.3. A Vállalkozó a megbízást a szerződés aláírásával elfogadja, és kijelenti, hogy jogosult és képes a munka elvégzésére. További alvállalkozót csak a Megrendelő előzetes hozzájárulásával vehet igénybe, akiért úgy felel, mintha a munkát maga végezte volna.</p>'+
   '<h2>2. Vállalkozói díj, fizetési feltételek</h2><p>2.1. A vállalkozói díj nettó <b>'+hufmt(f.dij)+'</b>'+(f.afa?' ('+e(f.afa)+')':'')+'.</p><p>2.2. A díj megfizetése '+e(f.fiz)+(pays.length?', az alábbi mérföldkövek szerint:':'.')+'</p>'+(pays.length?'<table>'+pays.map(function(y,i){return '<tr><td>'+(i+1)+'. '+e(y.t)+'</td><td style="text-align:right">'+hufmt(y.amt)+'</td></tr>'}).join('')+'</table>':'')+
   '<p>2.3. A teljesítés igazolása a munkarész GeneralTeam felületen történő készre jelentése, a Megrendelő általi ellenőrzése és átvétele alapján, teljesítésigazolással történik; a hiányosan vagy hibásan elvégzett munkarész a hiba kijavításáig nem igazolható. Fizetési késedelem esetén a Ptk. 6:155. §-a szerinti késedelmi kamat jár.</p>'+((+f.vissza)>0?'<p>2.3.1. A Megrendelő minden kifizetésből '+e(f.vissza)+'% garanciális visszatartást alkalmaz, amelyet a jótállási idő lejártát követő 15 napon belül, a jótállási kötelezettségek teljesítése esetén fizet ki; a Megrendelő a ki nem javított hiba javításának költségét ebből levonhatja.</p>':'')+'<p>2.4. A díjon felül a Megrendelő más jogcímen fizetésre nem köteles. Pótmunkát a Vállalkozó a GeneralTeam felületen javasolhat; azt csak a Megrendelő előzetes, írásbeli jóváhagyása után végezheti el és számolhatja el.</p>'+
   '<h2>3. A felek jogai és kötelezettségei</h2><p>3.1. A Vállalkozó a munkát a szakma szabályai, a technológiai előírások és a Megrendelő utasításai szerint, első osztályú minőségben végzi.</p><p>3.2. A Vállalkozó haladéktalanul tájékoztatja a Megrendelőt minden olyan körülményről, amely a határidőben és megfelelő minőségben történő teljesítést veszélyezteti; az értesítés elmulasztásából eredő kárért felel.</p><p>3.3. Ha a Megrendelő célszerűtlen vagy szakszerűtlen utasítást ad, a Vállalkozó köteles őt erre figyelmeztetni.</p><p>3.4. A Vállalkozó betartja és munkatársaival betartatja a munkavédelmi és munkabiztonsági előírásokat, a munkaterületet rendben tartja, a munkája során keletkező hulladékot – eltérő megállapodás hiányában – elszállítja.</p><p>3.5. A Megrendelő a munkát ellenőrizheti, de a Vállalkozó tevékenységét nem akadályozhatja.</p><p>3.6. A Vállalkozó a munkarészt átadás-átvételi eljárásban adja át; az átvétel nem tagadható meg olyan hiba miatt, amely a rendeltetésszerű használatot nem akadályozza.</p>'+
   (f.vedelem?'<p>3.7. Az építtetővel (a Megrendelő megrendelőjével) a Vállalkozó árban, pótmunkában és határidőben közvetlenül nem állapodik meg, és műszaki kérdésekben is a Megrendelőn keresztül, illetve a Megrendelő által engedett körben egyeztet. A Vállalkozó e szerződés hatálya alatt és megszűnését követő 12 hónapig az építtetőnek közvetlenül nem tesz ajánlatot a jelen munkával összefüggő munkákra.</p>':'')+
   '<h2>4. Késedelem, kötbér, módosítás, megszűnés</h2><p>4.1. A Vállalkozó a kezdési, rész- és befejezési határidők bármelyikének felróható elmulasztása esetén – türelmi idő nélkül, a késedelem első napjától – késedelmi kötbért fizet, amelynek mértéke naponta a nettó vállalkozói díj '+e(f.kotber)+'%-a, legfeljebb '+e(f.kotbermax)+'%-a. A kötbéren felüli kár is érvényesíthető, különösen az, amelyet a Megrendelő a megrendelőjével szemben a késedelem miatt viselni köteles. A Megrendelő a kötbért és a hibás vagy késedelmes teljesítésből eredő kárát a vállalkozói díjba beszámíthatja.</p><p>4.1.1. Ha a Vállalkozó késedelme meghaladja az 5 munkanapot, vagy írásbeli felszólítás ellenére sem kezdi meg, illetve folytatja a munkát, vagy ismételten hibásan teljesít, a Megrendelő a szerződéstől elállhat vagy azt azonnali hatállyal felmondhatja, és a hátralévő munkát a Vállalkozó költségére mással elvégeztetheti. A Vállalkozónak ilyenkor csak a szerződésszerűen elvégzett és átvett munka arányos díja jár.</p><p>4.2. Ha a teljesítés olyan okból válik lehetetlenné, amelyért egyik fél sem felelős, a Vállalkozót az elvégzett munka arányos díja illeti meg; ha a lehetetlenülés oka a Vállalkozó érdekkörében merült fel, díjra nem tarthat igényt.</p><p>4.3. Ha a Megrendelő és az építtető közötti szerződés megszűnik, a Megrendelő e szerződést azonos időpontra felmondhatja; ilyenkor a felek az elvégzett munka alapján elszámolnak.</p><p>4.4. A szerződést a felek írásban – a GeneralTeam felületen kölcsönösen elfogadott módosítással is – módosíthatják.</p>'+
   '<h2>5. Jótállás</h2><p>5.1. A Vállalkozó a Ptk. szerinti jótállással és szavatossággal tartozik, az átadás-átvételtől'+(f.jot?'; a vállalt jótállás '+e(f.jot)+' hónap':'')+'.</p><p>5.2. A Vállalkozó a hiba bejelentésétől számított 5 munkanapon belül, a rendeltetésszerű használatot akadályozó vagy további kárral fenyegető hiba esetén 24 órán belül megkezdi és folyamatosan végzi a javítást; ha ennek nem tesz eleget, a Megrendelő a hibát a Vállalkozó költségére – külön felszólítás nélkül – mással kijavíttathatja, és ennek költségét a Vállalkozó díjából levonhatja. A jótállási idő a Megrendelő és megrendelője közötti átadás-átvételtől számít.</p>'+
   '<h2>6. Vegyes és záró rendelkezések</h2><p>6.1. A felek a kapcsolattartásra a GeneralTeam alvállalkozói felületet és az e-mailt használják; a felületen tett jóváhagyások írásbeli nyilatkozatnak minősülnek. Kapcsolattartók – Megrendelő: Benkő Ádám, +36 70 627 67 06, info@generalteam.hu; Vállalkozó: '+e([f.nev,f.tel,f.email].filter(Boolean).join(', '))+'.</p><p>6.2. A felek vitáikat elsősorban tárgyalás útján rendezik; ennek eredménytelensége esetén a hatáskörrel és illetékességgel rendelkező bíróság jár el.</p><p>6.3. A szerződésben nem szabályozott kérdésekben a Ptk. irányadó.</p><p>6.4. A szerződés azon a napon lép hatályba, amelyen mindkét fél aláírta. A Megrendelő a szerződést akkor írja alá, amikor az építtetővel kötött szerződés és a munkában közreműködő többi alvállalkozói szerződés is aláírásra került.</p>'+

/* ===== v16: előfeltételek és párhuzamosság projektenként, munkanem és munkarész törlése ===== */
/* függőség: {k: előző munkanem, typ: 'FS' = utána (a befejezését követő munkanapon), 'SS' = vele párhuzamosan (együtt indul), lag: +/- munkanap} */
function depList(p,i){var x=p.phases[i];
  if(x.deps)return x.deps.map(function(d){return {j:kIdx(d.k),typ:d.typ==='SS'?'SS':'FS',lag:+d.lag||0}}).filter(function(d){return d.j>=0&&d.j!==i&&p.phases[d.j].st!=='skip'});
  return effDeps(p,i).map(function(j){return {j:j,typ:'T',lag:TPL[i].lag}})}
function sched(p){var S0=pd(p.start),out=[],st={};while(isOff(S0))S0=addD(S0,1);
  function calc(i){if(out[i])return out[i];if(st[i])return null;st[i]=1;var t=TPL[i],x=p.phases[i];
    if(x.st==='skip'){out[i]=[S0,S0];return out[i]}
    var a=S0;depList(p,i).forEach(function(d){var r=calc(d.j),c;if(!r)return;
      if(d.typ==='T'){if(d.lag>=0)c=addWork(r[1],d.lag);else{c=subWork(r[1],-d.lag);if(c<r[0])c=r[0]}}
      else if(d.typ==='SS'){c=d.lag>=0?addWork(r[0],d.lag):subWork(r[0],-d.lag)}
      else{c=d.lag>=0?addWork(r[1],1+d.lag):subWork(r[1],-d.lag-1);if(c<r[0])c=r[0]}
      if(c>a)a=c});
    if(x.kezd)a=pd(x.kezd);while(isOff(a))a=addD(a,1);
    var w=(+x.wd||t.wd)+xOk(p,i).reduce(function(s,e){return s+(+e.wd||0)},0),b=addWork(a,Math.max(1,w)-1);
    if(x.end){var o=pd(x.end);b=o>=a?o:a}out[i]=[a,b];return out[i]}
  TPL.forEach(function(t,i){calc(i)});return out}
function depReach(p,from,target,seen){seen=seen||{};if(from===target)return true;if(seen[from])return false;seen[from]=1;return depList(p,from).some(function(d){return depReach(p,d.j,target,seen)})}
function depRows(p,i){var x=p.phases[i];if(x.deps)return x.deps;var seen={},rows=[];depList(p,i).forEach(function(d){if(seen[d.j])return;seen[d.j]=1;rows.push({k:TPL[d.j].k,typ:d.typ==='T'?'FS':d.typ,lag:d.typ==='T'?d.lag-1:d.lag})});
  var base=iso(sched(p)[i][0]),kz=x.kezd;delete x.kezd;base=iso(sched(p)[i][0]);
  for(var n=rows.length-1;n>=0&&rows.length>1;n--){var r2=rows.slice(0,n).concat(rows.slice(n+1));x.deps=r2;if(iso(sched(p)[i][0])===base)rows=r2;delete x.deps}
  delete x.deps;if(kz)x.kezd=kz;return rows}
function depInit(p,i){var x=p.phases[i];if(!x.deps)x.deps=depRows(p,i).map(function(d){return {k:d.k,typ:d.typ,lag:d.lag}});return x.deps}
function depBox(p,i){var x=p.phases[i],L=depRows(p,i).map(function(d){return {j:kIdx(d.k),typ:d.typ,lag:+d.lag||0}}).filter(function(d){return d.j>=0&&p.phases[d.j].st!=='skip'}),cust=!!x.deps,open=view.depo===i;
  var sum=L.length?L.map(function(d){return '<b>'+esc(TPL[d.j].t)+'</b> '+(d.typ==='SS'?'– vele párhuzamosan'+(d.lag?' (+'+d.lag+' mn)':''):'– utána'+(d.lag>0?' +'+d.lag+' mn várakozással':(d.lag===-1?' (az utolsó napján már indulhat)':(d.lag<-1?' ('+(-d.lag-1)+' mn átfedéssel)':''))))}).join(' · '):'nincs – a projekt kezdésétől indulhat';
  var h='<div class="box" style="margin-top:10px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>Előfeltétel, párhuzamosság</b><span class="evr"><button class="btn sm ghost" data-depo="'+i+'">'+(open?'Bezárás':'Szerkesztés')+'</button></span></div><span style="font-size:13px">Mikor indulhat: '+sum+(x.kezd?' <span class="pill p-warn">kézzel rögzített kezdés: '+fd(pd(x.kezd))+' – ez felülírja</span>':'')+(cust?' <span class="pill p-info">egyedi</span>':'')+'</span>';
  if(open){var D=depRows(p,i),opts=function(sel){return TPL.map(function(t,j){if(j===i||p.phases[j].st==='skip')return '';var bad=depReach(p,j,i)&&t.k!==sel;return '<option value="'+t.k+'"'+(t.k===sel?' selected':'')+(bad?' disabled':'')+'>'+esc(t.t)+(bad?' (körkörös lenne)':'')+'</option>'}).join('')};
    h+=D.map(function(d,n){return '<div class="mini" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) 110px auto;gap:6px;align-items:end"><label class="fld">Előző munkanem<select data-depk="'+i+'|'+n+'">'+opts(d.k)+'</select></label><label class="fld">Kapcsolat<select data-dept="'+i+'|'+n+'"><option value="FS"'+(d.typ!=='SS'?' selected':'')+'>utána kezdődik</option><option value="SS"'+(d.typ==='SS'?' selected':'')+'>vele párhuzamosan (együtt indul)</option></select></label><label class="fld">'+(d.typ==='SS'?'Eltolás (mn)':'Várakozás (mn)')+'<input type="number" step="1" data-depl="'+i+'|'+n+'" value="'+(+d.lag||0)+'" title="'+(d.typ==='SS'?'Hány munkanappal később indul, mint az előző':'Száradás, technológiai szünet munkanapban; negatív = átfedés')+'"></label><button class="xbtn" data-depdel="'+i+'|'+n+'" title="Előfeltétel törlése" aria-label="Előfeltétel törlése">×</button></div>'}).join('');
    h+='<span class="evr"><button class="btn sm ghost" data-depadd="'+i+'">+ Előfeltétel</button>'+(cust?'<button class="btn sm ghost" data-depreset="'+i+'">Alapbeállítás (technológiai sorrend)</button>':'')+(view.depSnap?'<button class="btn sm" data-depntf="'+i+'">Értesítés a változásról</button>':'')+'</span><span class="muted" style="font-size:12.5px">A változás azonnal átvezetődik az ütemtervben, a ráépülő munkák is tolódnak. „Utána” = az előző befejezését követő munkanapon; „párhuzamosan” = az előzővel egy napon indul. Az értesítést a gombbal küldheted ki (ügyfél, kapcsolattartók, érintett alvállalkozók).</span>'}
  h+='<div style="display:flex;justify-content:flex-end;margin-top:6px"><button class="btn sm ghost" data-phdel="'+i+'" style="color:var(--bad)">'+(view.phdelc===i?'Biztosan törlöd? Kattints újra':'Munkanem törlése a projektből')+'</button></div>';
  return h+'</div>'}
function depSnapTake(p){if(!view.depSnap||view.depSnap.pid!==p.id)view.depSnap={pid:p.id,s:sched(p).map(function(r){return [new Date(r[0]),new Date(r[1])]})}}
function depChange(t,p){if(!p)return false;var q,x;
  if(t.dataset.depk){q=t.dataset.depk.split('|');x=p.phases[+q[0]];depSnapTake(p);depInit(p,+q[0])[+q[1]].k=t.value;log(p,'Előfeltétel módosítva: '+TPL[+q[0]].t);save();render();return true}
  if(t.dataset.dept){q=t.dataset.dept.split('|');depSnapTake(p);var dq=depInit(p,+q[0])[+q[1]];dq.typ=t.value;dq.lag=0;log(p,'Kapcsolat módosítva: '+TPL[+q[0]].t+' – '+(t.value==='SS'?'párhuzamos':'utána'));save();render();return true}
  if(t.dataset.depl){q=t.dataset.depl.split('|');depSnapTake(p);depInit(p,+q[0])[+q[1]].lag=Math.round(+t.value||0);save();render();return true}
  return false}
function phDel(p,i){var x=p.phases[i],k=TPL[i].k,paid=(p.pays||[]).some(function(y){return y.ph===i&&y.st==='paid'});
  if(paid){toast('Ehhez a munkanemhez már van kifizetett mérföldkő – előbb rendezd a pénzügyeknél');return}
  depSnapTake(p);var old=view.depSnap.s;
  x.st='skip';x.chk=(x.chk||[]).map(function(){return false});x.xchk={};delete x.kezd;delete x.end;delete x.deps;delete x.pend;
  p.pays=(p.pays||[]).filter(function(y){return y.ph!==i});p.mods=(p.mods||[]).filter(function(m){return m!==k});
  (p.alv||[]).forEach(function(a){a.phases=(a.phases||[]).filter(function(z){return z!==k})});
  p.phases.forEach(function(y){if(y.deps)y.deps=y.deps.filter(function(d){return d.k!==k})});
  log(p,'Munkanem törölve a projektből: '+TPL[i].t);view.phdelc=null;view.depo=null;
  var j=p.phases.findIndex(function(y){return y.st!=='skip'});view.ph=j<0?0:j;save();toast(TPL[i].t+' törölve – értesítést a „Értesítés a változásról” gombbal küldhetsz');render()}
function depNotify(p){if(!view.depSnap)return;var nw=sched(p),chg=diffSched(view.depSnap.s,nw);if(!chg.length){view.depSnap=null;toast('Nincs határidő-változás');render();return}
  var n=notifyAll(p,'Ütemezés módosult: '+p.nev,function(r){return '<p>Módosult a(z) <b>'+esc(p.nev)+'</b> projekt ütemezése (munkanemek sorrendje, párhuzamossága). A frissített ütemezés, a változások kiemelve:</p>'+schedMail(p,chg)});
  n+=alvNotifyChg(p,chg,'Ütemezés pontosítása');view.depSnap=null;log(p,'Ütemezés-változás kiküldve ('+chg.length+' munkanem)');toast(n?n+' értesítés elküldve':'Rögzítve (nincs címzett)');render()}

    var l4=ofLead(),att=ofAtt(),sel=MODS.filter(function(m){return OF.mods[m[0]]});

main.addEventListener('change',function(e){var t=e.target,p=S.projects.filter(function(x){return x.id===view.pid})[0];if(h2Change(t,p))return;if(gtChange(t,p))return;if(partChange(t))return;if(alvChange(t,p))return;
  if(t.dataset.set){S.settings[t.dataset.set]=t.value.trim();toast('Mentve');save();return}
  if(t.dataset.pe){p.email=t.value.trim();toast('Ügyfél e-mail mentve');save();return}
  if(t.dataset.lkov||t.dataset.lkovd){var lk=S.leads.filter(function(x){return x.id===(t.dataset.lkov||t.dataset.lkovd)})[0];if(lk){if(t.dataset.lkov)lk.kov=t.value;else lk.kovd=t.value;save();toast('Követés mentve')}return}
  if(t.dataset.lmemo){var lm=S.leads.filter(function(x){return x.id===t.dataset.lmemo})[0];if(lm){lm.memo=t.value;toast('Jegyzet mentve');save()}return}
  if(t.dataset.kert!=null){p.kont[+t.dataset.kert].ert=t.checked;save();return}
  if(t.id==='pe_k'||t.id==='ne_k'){var lf=document.getElementById(t.id==='pe_k'?'pe_l':'ne_l');if(lf){if(t.value==='konz'){lf.value=meetUrl();lf.placeholder='Meet / Zoom link'}else{lf.value=t.id==='pe_k'&&p?(p.hely||''):'';lf.placeholder='Helyszín'}}return}
  if(t.id==='am_wd'){view.amwd=Math.max(1,+t.value||0)||null;view.amamt=+gv('am_amt')||null;render();return}
  if(t.id==='am_amt'){view.amamt=+t.value||0;return}
  if(t.dataset.lupl){var lu=S.leads.filter(function(x){return x.id===t.dataset.lupl})[0];if(lu){view.lopen=lu.id;upFiles(t.files,'megkereses-'+lu.id,function(f){lu.files=lu.files||[];lu.files.push(f);render()})}return}
  if(t.id==='mzupl'){upFiles(t.files,p.id,function(f){view.matt=(view.matt||[]).concat([f]);view.mtext=gv('mz_t');render()});return}
  if(t.dataset.setb){S.settings[t.dataset.setb]=t.checked;toast(t.checked?'Naptár-szinkron bekapcsolva':'Naptár-szinkron kikapcsolva');save();return}
  if(t.id==='offupl'){upFiles(t.files,p.id,function(f){if(!p.offer)p.offer={d:iso(TODAY),src:'pdf',sum:p.pays.reduce(function(s0,y){return s0+y.amt},0),targy:p.nev,hely:p.hely,m2:p.m2};p.offer.files=(p.offer.files||[]).concat([f]);log(p,'Ajánlat csatolva: '+f[0]+(f[1]?'.'+f[1]:''));render()});return}
  if(t.dataset.payupl){var pu=t.dataset.payupl.split('|'),pp4=S.projects.filter(function(x){return x.id===pu[0]})[0],y4=pp4&&pp4.pays[+pu[1]];if(y4)upFiles(t.files,pp4.id,function(f){y4.docs=(y4.docs||[]).concat([f]);log(pp4,'Számla / díjbekérő csatolva: '+y4.t);toast('Csatolva, az ügyfél letöltheti a portálon');render()});return}
  if(t.id==='ofupl'){upFiles(t.files,'ajanlat-'+(OF.lead||'altalanos'),function(f){OF.att.push(f);render()});return}
  if(t.dataset.lf!=null){OF.lf[+t.dataset.lf]=t.checked?1:0;render();return}
  if(t.dataset.chk!=null){p.phases[view.ph].chk[+t.dataset.chk]=t.checked;if(p.phases[view.ph].st==='todo')p.phases[view.ph].st='active';render()}

});
main.addEventListener('input',function(e){var t=e.target;if(gtInput(t))return;if(t.id==='mz_t'){view.mtext=t.value;return}
  if(t.dataset.of){OF[t.dataset.of]=t.type==='number'?(+t.value||0):t.value;softRender(t)}

  else if(t.dataset.desc){OF.desc[t.dataset.desc]=t.value;softRender(t)}

function softRender(t){var k=['of','rate','desc','ox','q','mwd'].filter(function(x){return t.dataset[x]!=null})[0],id=t.dataset[k],pos=t.selectionStart;render();var n=main.querySelector('[data-'+k+'="'+id+'"]');if(n){n.focus();try{if(pos!=null&&(n.type==='text'||n.tagName==='TEXTAREA'))n.setSelectionRange(pos,pos)}catch(_){}}}
boot();

})();
