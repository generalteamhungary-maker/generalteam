<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kókai Terv – iroda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: bal oldali menü + munkaterület; a projekt nézet egy idővonal (fázisok) + részletpanel */
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --fg:#0F1D26; --muted:#56656D; --line:#DCE2E4; --soft:#EEF1EF;
  --brand:#1A56A0; --brand-tint:#E8EFF7; --on-brand:#FFFFFF; --brass:#F0A23B; --brass-tint:#FDF1DF;
  --ok:#1F7A4D; --ok-tint:#E3F2EA; --warn:#9A5B00; --warn-tint:#FDF1DF; --bad:#B3261E; --bad-tint:#FBE9E7;
  --display:'Bricolage Grotesque',Georgia,serif; --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html,:root[data-theme]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;gap:10px;align-items:center}
.brand b{font-family:var(--display);font-size:17px;display:block;line-height:1.1}
.brand small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;border:0;border-radius:7px;padding:9px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.menu button:hover{background:var(--soft);color:var(--fg)}
.menu button[aria-current="page"]{background:var(--brand-tint);color:var(--brand);font-weight:600}
.menu .cnt{font-size:11.5px;background:var(--brass);color:#2B1B00;border-radius:99px;padding:0 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.pro{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;background:var(--brand);color:var(--on-brand);border-radius:4px;padding:1px 6px;vertical-align:1px}
.main{padding:22px 26px 60px;min-width:0;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.demo{font-size:12.5px;background:var(--brass-tint);color:var(--warn);border-radius:6px;padding:6px 10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:7px;padding:8px 14px;border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn.sec{background:transparent;color:var(--brand)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi b{font-family:var(--display);font-size:26px;display:block}
.kpi span{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-tint);color:var(--ok)}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-bad{background:var(--bad-tint);color:var(--bad)}
.p-info{background:var(--brand-tint);color:var(--brand)}
.p-mute{background:var(--soft);color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
/* projekt */
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:500}
.ptabs button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand);font-weight:600}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.gantt{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.gl{display:grid;grid-template-columns:200px minmax(420px,1fr);gap:10px;align-items:center;font-size:13px}
.gl .lab{display:flex;gap:6px;align-items:center;min-width:0}
.gl .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:22px;background:var(--soft);border-radius:4px}
.seg{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--line)}
.seg.done{background:var(--ok)}
.seg.active{background:var(--brand)}
.seg.wait{background:var(--brass)}
.brk{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--muted) 28%,transparent) 4px 6px)}
.today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.axis{display:grid;grid-template-columns:200px minmax(420px,1fr);gap:10px;font-size:11px;color:var(--muted)}
.axis .ticks{position:relative;height:16px}
.axis .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.phases{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.plist{display:flex;flex-direction:column;gap:6px}
.plist button{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;cursor:pointer;align-items:start}
.plist button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.dot.done{background:var(--ok);color:#fff}.dot.active{background:var(--brand);color:var(--on-brand)}.dot.wait{background:var(--brass);color:#2B1B00}
.plist .pt{font-weight:600;font-size:14px}
.plist .ps{font-size:12px;color:var(--muted)}
.plist button.skip{border-style:dashed;background:transparent}
.plist button.skip .pt{color:var(--muted);font-weight:500}
.plist .sep{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 2px 2px}
.req-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;background:var(--soft);color:var(--muted);border-radius:4px;padding:1px 6px;margin-left:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{margin-top:3px;accent-color:var(--ok);width:16px;height:16px}
.chk.on span{color:var(--muted);text-decoration:line-through}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.counter{display:flex;align-items:center;gap:8px;font-size:13.5px}
.counter .bx{display:flex;gap:3px}
.counter .bx i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--brand)}
.counter .bx i.on{background:var(--brand)}
.counter .bx i.x{border-color:var(--bad);background:var(--bad)}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;gap:10px;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.doc .ext{font-family:var(--mono);font-size:11px;background:var(--soft);border-radius:4px;padding:1px 5px}
/* megkeresések */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:13px;display:flex;justify-content:space-between;color:var(--muted);font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.lead b{font-size:14.5px}
/* ajánlat */
.offer{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{font-weight:400;font-size:14px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
.mod{display:grid;grid-template-columns:22px minmax(0,1fr) 120px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mod input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.mod small{display:block;color:var(--muted);font-size:12px}
.paper{background:#FFFFFF;color:#1F2328;border:1px solid var(--line);border-radius:4px;padding:28px 30px;display:flex;flex-direction:column;gap:14px;font-size:13px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.paper h2{font-family:var(--body);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#1F2328}
.paper .hdr{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#5A6168;border-bottom:1px solid #1F2328;padding-bottom:10px}
.paper table{font-size:12.5px;color:#1F2328}
.paper td,.paper th{border-color:#E1E4E6;color:#1F2328}
.paper .tot td{font-weight:700;border-top:1.5px solid #1F2328}
.paper ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.paper .small{font-size:11.5px;color:#5A6168}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:30}
.mtop{display:none}
.g3e{grid-template-columns:repeat(3,minmax(0,1fr))}
.box{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.box.warn{background:var(--warn-tint);color:#5c3a00}
.box b{font-weight:600}
.mini{display:grid;gap:8px}
.mini.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mini.c3{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
.lnk{color:var(--brand);font-weight:600;text-decoration:none;font-size:13px;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.evr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.xbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:4px}
.xbtn:hover{background:var(--bad-tint);color:var(--bad)}
.lead details{border-top:1px dashed var(--line);padding-top:6px}
.lead summary{cursor:pointer;font-size:12.5px;color:var(--brand);font-weight:600}
.lead textarea{min-height:60px;font-size:13px}
.lfile{display:flex;gap:6px;align-items:center;font-size:12.5px;overflow-wrap:anywhere}
.chg{font-size:11px;font-weight:700;color:var(--warn);margin-left:4px}
textarea{min-height:70px;resize:vertical}
.thread{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow:auto;padding:4px 2px}
.bub{max-width:80%;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px;align-self:flex-start;display:flex;flex-direction:column;gap:4px}
.bub.me{align-self:flex-end;background:var(--brand-tint)}
.bub .mh{font-size:11.5px;color:var(--muted)}
input[type=time]{font-weight:400;font-size:14px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
@media (max-width:1100px){.g3e{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.offer{grid-template-columns:minmax(0,1fr)}.phases{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .menu{flex-direction:row;overflow-x:auto;gap:4px}
  .menu button{white-space:nowrap}
  .side .foot{display:none}
  .main{padding:16px 16px 60px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.paper{padding:18px}}
@media (max-width:640px){
  .main{overflow-x:hidden;gap:16px}
  .gantt{overflow:visible}
  .gl,.axis{grid-template-columns:minmax(0,1fr);gap:3px}
  .gl .lab{font-size:12.5px}
  .axis>span:first-child{display:none}
  .mini.c2,.mini.c3{grid-template-columns:minmax(0,1fr)}
  .head{flex-direction:column;gap:8px}
  .row{grid-template-columns:minmax(0,1fr)}
  .bub{max-width:94%}
  .kanban{grid-template-columns:repeat(4,minmax(260px,84vw));scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .card{padding:14px}
  h1{font-size:23px}
  .meta{gap:6px 14px}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{font-size:16px}
  .menu button{padding:8px 10px}
  .btn{white-space:normal;text-align:left}
  .side{position:sticky;top:0;z-index:20;padding:10px 12px}
  .side .brand small{display:none}
  .toast{left:12px;right:12px;transform:none;text-align:center}
}

.nbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.nseg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.nseg button{border:0;background:none;padding:7px 14px;cursor:pointer;font:inherit;font-size:14px;color:var(--fg)}
.nseg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:600}
.nnav{display:flex;gap:4px}.nlab{font-size:15px}
.nwcard{padding:12px}.nwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.nwk{min-width:760px}
.nwh{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line)}
.nwd{padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0;border-left:1px solid var(--line)}
.nwd.td b{color:#fff;background:var(--brand);border-radius:6px;padding:1px 6px;align-self:flex-start}
.nwd.off{background:var(--soft)}.nwn{font-size:11.5px;color:var(--muted)}
.ndl{font-size:11px;background:#FBE6E4;color:#8E1F18;border-radius:4px;padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nwb{position:relative;display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr))}
.nwt{position:relative}.nwt span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-6px)}
.nwc{position:relative;border-left:1px solid var(--line)}.nwc.off{background:var(--soft)}
.nws{position:absolute;left:0;right:0;border:0;border-top:1px solid var(--line);background:transparent;cursor:pointer;padding:0}
.nws:hover{background:rgba(15,43,54,.05)}
.nwe{position:absolute;border:0;border-left:4px solid;border-radius:6px;padding:3px 6px;text-align:left;font:inherit;font-size:12px;line-height:1.25;cursor:pointer;overflow:hidden;color:#1F2328;display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 2px rgba(0,0,0,.08);z-index:2}
.nwe span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.nwe.sel{outline:2px solid var(--brand);outline-offset:1px}
.nnow{position:absolute;left:0;right:0;height:0;border-top:2px solid #C5221F;z-index:3;pointer-events:none}
.nmo{min-width:700px}.nmh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--muted);padding-bottom:4px}
.nmg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.nmc{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.nmc.out{opacity:.45}.nmc.off{background:var(--soft)}.nmc.l1{background:#EEF4F6}.nmc.l2{background:#DCE9EE}.nmc.l3{background:#C5DCE5}
.nmd{align-self:flex-start;border:0;background:none;font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:1px 6px;border-radius:6px;color:var(--fg)}
.nmc.td .nmd{background:var(--brand);color:#fff}
.nmi{border:0;border-left:3px solid;border-radius:4px;font:inherit;font-size:11.5px;text-align:left;padding:2px 5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1F2328}
.nmm{border:0;background:none;font:inherit;font-size:11.5px;color:var(--brand);cursor:pointer;text-align:left;padding:0 5px}
.nselc .head{align-items:flex-start}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <img id="logoimg" alt="Kókai Terv logó" width="36" height="36" style="display:block;mix-blend-mode:multiply">
      <div><b>Kókai Terv</b><small>GeneralTeam iroda</small></div>
    </div>
