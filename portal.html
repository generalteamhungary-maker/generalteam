.docs{display:flex;flex-direction:column;gap:6px}
.ext{font-family:var(--display);font-size:11px;letter-spacing:.08em;background:var(--paper);padding:1px 6px}

.card{border-radius:12px}

.lnkb{border:0;background:none;color:var(--sage);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;padding:0;align-self:flex-start}

  td.r{font-size:14px}
